worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    # text/html is compressed by nginx automatically.
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json application/xml
               text/xml image/svg+xml;

    map $uri $cache_kind {
        default public;
        /healthz health;
        ~^/_astro/ immutable;
        ~*\.html?$ html;
    }

    # Never attach asset/public caching to errors or redirects.
    map "$status:$cache_kind" $cache_control {
        default "";
        ~^(200|206|304):immutable$ "public, max-age=31536000, immutable";
        ~^(200|206|304):public$ "public, max-age=3600";
        ~^(200|206|304):html$ "no-cache";
        ~^200:health$ "no-store";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # Keep all headers here: locations do not override their inheritance.
        add_header X-Site-ID "paintwarden-site" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control $cache_control;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location ^~ /_astro/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
