services:
  paintwarden:
    build: .
    image: paintwarden:local
    container_name: paintwarden
    restart: unless-stopped
    ports:
      - "${PAINTWARDEN_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /data
      PAINTWARDEN_TRUST_PROXY: "${PAINTWARDEN_TRUST_PROXY:-0}"
      PAINTWARDEN_ALLOWED_HOSTS: "${PAINTWARDEN_ALLOWED_HOSTS:-}"
    volumes:
      - paintwarden-data:/data

volumes:
  paintwarden-data:
    name: "${PAINTWARDEN_VOLUME:-paintwarden-data}"
