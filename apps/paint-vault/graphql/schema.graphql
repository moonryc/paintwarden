extend type Query {
  wishlist(
    first: Int! = 48
    after: String
    miniatureId: ID
    missingFirst: Int! = 48
    missingAfter: String
  ): WishlistView!
  wishlistModelOptions(first: Int! = 40, after: String, search: String): WishlistModelOptionsView!
  wishlistRelatedProjects(paintId: ID!, first: Int! = 30, after: String): WishlistProjectConnection!
  """
  Complete filtered shopping text, independent of loaded pages.
  """
  wishlistExport(miniatureId: ID): WishlistExport!
}
type WishlistCounts {
  shoppingPaints: Int!
  restockPaints: Int!
  projectCount: Int!
  """
  Distinct unlisted project paint issues, globally, independent of model filter.
  """
  missingPaints: Int!
  """
  Unlisted paint issues with missing physical stock (may also be broken).
  """
  missingStock: Int!
  brokenSubstitution: Int!
  listedMissingStock: Int!
}
type WishlistProject {
  id: ID!
  title: String!
}
type WishlistRow {
  id: ID!
  paint: Paint!
  brandGroup: String!
  restock: Boolean!
  missingStock: Boolean!
  brokenSubstitution: Boolean!
  projectCount: Int!
  relatedProjectsPreview: [WishlistProject!]!
  relatedProjectsTruncated: Boolean!
}
type WishlistConnection {
  nodes: [WishlistRow!]!
  totalCount: Int!
  pageInfo: PageInfo!
}
type WishlistView {
  revision: VaultRevision!
  counts: WishlistCounts!
  shopping: WishlistConnection!
  missing: WishlistConnection!
}
