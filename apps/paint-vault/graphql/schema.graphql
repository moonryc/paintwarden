# Plugin metadata is deferred until the Plugins dialog opens. No catalog rows/assets.
type SourceItemCounts {
  paints: Int!
  schemes: Int!
  templates: Int!
}
type SourceDependency {
  repository: String!
  minimumVersion: String
}
type ErrorParameter {
  name: String!
  value: String!
}
type PublicError {
  code: String!
  parameters: [ErrorParameter!]!
}
type CatalogSource {
  id: ID!
  repository: String!
  url: String!
  name: String!
  version: String!
