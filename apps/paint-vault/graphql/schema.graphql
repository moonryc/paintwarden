# Schemes browse and ordinary owner commands share the miniature scheme projection.
extend type Query {
  schemes(
    first: Int! = 48
    after: String
    search: String
    category: String
    sourceId: ID
    noSource: Boolean! = false
    readiness: SchemeReadiness
    usesPaintIds: [ID!]! = []
  ): SchemesView!
  schemePaintOptions(search: String! = "", excludeIds: [ID!]! = [], first: Int! = 30): PaintOptionsView!
}
enum SchemeReadiness {
  READY
  MISSING
}
type SchemesView {
  revision: VaultRevision!
  nodes: [MiniatureScheme!]!
  totalCount: Int!
  pageInfo: PageInfo!
  facets: SchemeFacets!
}
type SchemeFacets {
  categories: [FacetCount!]!
  sources: [FacetCount!]!
  readiness: [FacetCount!]!
}
extend type MiniatureScheme {
  sourceId: ID
  paintNames: String!
  usageCount: Int!
  gradient: String!
  previewMoreCount: Int!
}
extend type Mutation {
  createScheme(input: SchemeInput!, clientMutationId: String): SchemeMutationPayload!
  updateScheme(id: ID!, input: SchemeInput!, clientMutationId: String): SchemeMutationPayload!
  deleteScheme(id: ID!, clientMutationId: String): SchemeMutationPayload!
}
input SchemeInput {
  name: String!
  category: String!
  entries: [SchemeEntryInput!]!
}
input SchemeEntryInput {
  type: MiniatureSchemeEntryKind!
  paintId: ID
  id: ID
  label: String
  tone: String
  role: String
  imageUrl: String
  thumbnailUrl: String
  imageType: String
  method: String
}
type SchemeMutationPayload {
  revision: VaultRevision!
  schemeId: ID!
  clientMutationId: String
  invalidatedFamilies: [VaultFamily!]!
}

extend type Query {
  paintRanking(id: ID!, first: Int! = 30, after: String, ownedOnly: Boolean! = false): PaintRankingView!
  ownedPaintOptions(search: String! = "", first: Int! = 30): PaintOptionsView!
}
type PaintRankingView {
  revision: VaultRevision!
  paint: Paint
  owned: Boolean!
  suggestedId: ID
  nodes: [RankedPaint!]!
  totalCount: Int!
  pageInfo: PageInfo!
}
type RankedPaint {
  paint: Paint!
  match: PaintColorMatch!
  sameType: Boolean!
}
type PaintColorMatch {
  score: Int!
  distance: Float!
  lightnessDelta: Float!
  hueDelta: Float
  intensityDelta: Float!
}

# Ordinary paint commands share synchronous validation/SQL with the legacy REST wrappers.
extend type Mutation {
  importCustomPaints(paints: [CustomPaintImportInput!]!, clientMutationId: String): PaintImportPayload!
  updateCustomPaint(id: ID!, input: CustomPaintInput!, clientMutationId: String): PaintCommandPayload!
  deleteCustomPaint(id: ID!, clientMutationId: String): PaintCommandPayload!
  createSubstitution(input: SubstitutionInput!, clientMutationId: String): SubstitutionMutationPayload!
  setSubstitutionDefault(id: ID!, enabled: Boolean!, clientMutationId: String): SubstitutionMutationPayload!
  deleteSubstitution(id: ID!, clientMutationId: String): SubstitutionMutationPayload!
  selectPaintSubstitution(
    miniatureId: ID!
    targetPaintId: ID!
    substitutionId: ID
    useOriginal: Boolean! = false
    clientMutationId: String
  ): SubstitutionMutationPayload!
}
input CustomPaintImportInput {
  brand: String
  range: String
  type: String
  name: String
  colorHex: String
  sourceUrl: String
}
input CustomPaintInput {
  brand: String!
  range: String
  name: String!
  colorHex: String
  sourceUrl: String
}
input SubstitutionInput {
  targetPaintId: ID!
  name: String!
  ingredients: [SubstitutionIngredientInput!]!
}
input SubstitutionIngredientInput {
  paintId: ID!
  parts: Int
}
type PaintImportPayload {
  imported: Int!
  skipped: Int!
  revision: VaultRevision!
  clientMutationId: String
  invalidatedFamilies: [VaultFamily!]!
}
type PaintCommandPayload {
  paintId: ID!
  revision: VaultRevision!
  clientMutationId: String
  invalidatedFamilies: [VaultFamily!]!
}
type SubstitutionMutationPayload {
  substitutionId: ID
  miniatureId: ID
  paintId: ID
  revision: VaultRevision!
  clientMutationId: String
  invalidatedFamilies: [VaultFamily!]!
}
