  }
}
mutation SelectPaintSubstitution(
  $miniatureId: ID!
  $targetPaintId: ID!
  $substitutionId: ID
  $useOriginal: Boolean! = false
  $clientMutationId: String
) {
  selectPaintSubstitution(
    miniatureId: $miniatureId
    targetPaintId: $targetPaintId
    substitutionId: $substitutionId
    useOriginal: $useOriginal
    clientMutationId: $clientMutationId
  ) {
    miniatureId
    paintId
    substitutionId
    revision {
      epoch
      seq
    }
    clientMutationId
    invalidatedFamilies
  }
}
