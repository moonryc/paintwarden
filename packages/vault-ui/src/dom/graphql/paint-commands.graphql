mutation ImportCustomPaints($paints: [CustomPaintImportInput!]!, $clientMutationId: String) {
  importCustomPaints(paints: $paints, clientMutationId: $clientMutationId) {
    imported
    skipped
    revision {
      epoch
      seq
    }
    clientMutationId
    invalidatedFamilies
  }
}
mutation UpdateCustomPaint($id: ID!, $input: CustomPaintInput!, $clientMutationId: String) {
  updateCustomPaint(id: $id, input: $input, clientMutationId: $clientMutationId) {
    paintId
    revision {
      epoch
      seq
    }
    clientMutationId
    invalidatedFamilies
  }
}
mutation DeleteCustomPaint($id: ID!, $clientMutationId: String) {
  deleteCustomPaint(id: $id, clientMutationId: $clientMutationId) {
    paintId
    revision {
      epoch
      seq
    }
    clientMutationId
    invalidatedFamilies
  }
}
mutation CreateSubstitution($input: SubstitutionInput!, $clientMutationId: String) {
  createSubstitution(input: $input, clientMutationId: $clientMutationId) {
