query ProjectMiniatureDetails(
  $id: ID!
  $recipeAfter: String
  $schemesAfter: String
  $missingAfter: String
  $requiredAfter: String
  $entriesAfter: String
) {
  miniature(id: $id) {
    revision {
      epoch
      seq
    }
    miniature {
      id
      folderId
      title
      status
      paintingStatus
      imageUrl
      createdAt
      notes
      manufacturer
      faction
      scale
    }
    recipeSteps
    recipe(first: 40, after: $recipeAfter) {
      nodes {
        id
        paint {
          ...DetailPaint
        }
        step
        notes
        sortOrder
      }
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    schemes(first: 40, after: $schemesAfter) {
      nodes {
        id
        sortOrder
        scheme {
          id
          name
          category
          isSystem
          sourceName
          sourceLogoUrl
          paintCount
          availableCount
          previewSwatches {
            paintId
            colorHex
          }
          previewSwatchesTruncated
          imageUrl
          thumbnailUrl
        }
      }
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    attachedSchemeEntries(first: 40, after: $entriesAfter) {
      nodes {
        id
        schemeId
        kind
        sortOrder
        paint {
          ...DetailPaint
        }
        label
        tone
        role
        imageUrl
        thumbnailUrl
        imageType
        method
      }
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    missing(first: 40, after: $missingAfter) {
      nodes {
        id
        paint {
          ...DetailPaint
        }
        missingStock
        brokenSubstitution
      }
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    required(first: 40, after: $requiredAfter) {
      nodes {
        ...DetailPaint
      }
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
