query ColorToolIndex($after: String) {
  colorIndex(first: 100, after: $after) {
    revision {
      epoch
      seq
    }
    nodes {
      id
      name
      brand
      hex
      owned
      available
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query SchemeColorToolIndex($after: String) {
  schemeColorIndex(first: 100, after: $after) {
    revision {
      epoch
      seq
    }
    nodes {
      schemeId
      schemeName
      paint {
        id
        name
        brand
        hex
        owned
        available
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
