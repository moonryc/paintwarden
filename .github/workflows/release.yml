name: Release

# Pushing a tag such as v1.2.3 builds the desktop apps and uploads them, with their update files,
# to a draft GitHub release. Review the draft and publish it; installed apps only see published
# releases. Signing secrets are described in README.md under "Releasing".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

  # Format, lint, typecheck, tests, Storybook and desktop packaging checks, shared with pushes and PRs.
  quality:
    needs: version
    uses: ./.github/workflows/quality.yml

  desktop:
    needs: [version, quality]
    strategy:
      fail-fast: false
      matrix:
        # Match Quality: the staged native-module install needs node-gyp-compatible VS 2022.
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # macOS installs updates only for signed, notarized apps, so a release never ships without them.
      - name: Check macOS signing secrets
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$APPLE_ID" ]; then
            echo "::error::Add the macOS signing secrets described in README.md before releasing."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/package-desktop-server.mjs electron
      - run: npm run dist --workspace paint-vault-electron -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
