name: Release

# A dispatch is always a dry run: build the real installers/update files, but never publish.
# Only an intentional version tag can reach the publish job.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p 'require("./package.json").version')"
          fi
          node scripts/check-release-version.mjs "$tag"
          node scripts/release-notes.mjs "$tag" release-notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  quality:
    needs: version
    uses: ./.github/workflows/quality.yml

  desktop:
    needs: [version, quality]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/package-desktop-server.mjs electron
      - name: Extract this version's release notes
        run: node scripts/release-notes.mjs "${{ needs.version.outputs.tag }}" release-notes.md
      - name: Build installers and update metadata (never publish from a build job)
        run: npm run dist --workspace paintwarden-electron -- --publish never
        env:
          PAINTWARDEN_RELEASE_NOTES_FILE: ${{ github.workspace }}/release-notes.md
          # Complete sets opt in; absent or partial sets intentionally build unsigned.
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_P12_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_P12_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - run: npm run e2e:native
        env:
          E2E_ARTIFACTS_DIR: outputs/native-release
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/electron/*.dmg
            dist/electron/*.zip
            dist/electron/*.exe
            dist/electron/*.yml
            dist/electron/*.blockmap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-${{ runner.os }}
          retention-days: 7
          path: outputs/native-release

  publish:
    # No workflow_dispatch (including on main) can publish or create a Release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, quality, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Publish one immutable release with its exact changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          node scripts/release-notes.mjs "$TAG" release-notes.md
          flags=(--latest)
          if [[ "$TAG" == *-beta.* ]]; then flags=(--prerelease --latest=false); fi
          # Exclude diagnostic artifacts. A retry must not silently overwrite an existing release.
          mapfile -t assets < <(find artifacts/release-macOS artifacts/release-Windows -maxdepth 1 -type f | sort)
          test "${#assets[@]}" -gt 0
          gh release create "$TAG" --verify-tag --title "Paintwarden ${TAG#v}" --notes-file release-notes.md "${flags[@]}" "${assets[@]}"
