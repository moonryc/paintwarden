name: Quality

on:
  push:
  pull_request:
  # The Release workflow runs these checks before it builds and uploads a release.
  workflow_call:

jobs:
  shared:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run notices:check
      - run: npm run audit:production
      - run: npm run i18n:check
      - run: npm run codegen:check
      - run: npm run format:check
      - run: npm run lint:eslint
      - run: npm run typecheck:shared
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run storybook:test
      - name: Wishlist action palette, focus, contrast and geometry regression
        run: node scripts/smoke-wishlist-actions.mjs outputs/wishlist-actions --geometry-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wishlist-actions
          retention-days: 7
          path: outputs/wishlist-actions
      - name: Responsive global banner geometry regression
        run: node scripts/smoke-banner-layout.mjs outputs/banner-layout --geometry-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: banner-layout
          retention-days: 7
          path: outputs/banner-layout
      - run: npm run build
      - run: node scripts/check-notice-artifact.mjs --web-root apps/paintwarden-web/dist
      - run: node scripts/check-notice-artifact.mjs --web-root apps/paintwarden-site/dist
      # Dockerfile checks final /app notices, native linkage and sharp after pruning WASM.
      - run: docker build --tag paintwarden-notices-ci .

  macos:
    timeout-minutes: 25
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - run: xcrun actool --version
      - run: npm ci
      - run: npm run notices:check
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/package-desktop-server.mjs electron
      - run: npm run dist --workspace paintwarden-electron -- --dir --publish never
      - name: Verify ad-hoc macOS signature and Gatekeeper rejection (not damage)
        run: node scripts/check-mac-signature.mjs "$(find dist/electron -type d -name '*.app' -maxdepth 3 -print -quit)" --adhoc
      - name: Verify packaged macOS notices and dynamic libvips
        run: node scripts/check-notice-artifact.mjs --resources "$(find dist/electron -type d -path '*.app/Contents/Resources' -print -quit)"
      - run: npm run e2e:native
        env:
          E2E_ARTIFACTS_DIR: outputs/native-${{ runner.os }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-${{ runner.os }}
          retention-days: 7
          path: outputs/native-${{ runner.os }}

  windows:
    timeout-minutes: 25
    # npm's bundled node-gyp supports VS 2022, not the VS 2026 image behind windows-latest.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run notices:check
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/package-desktop-server.mjs electron
      - run: npm run dist --workspace paintwarden-electron -- --dir --publish never
      - name: Verify packaged Windows notices and dynamic libvips
        run: node scripts/check-notice-artifact.mjs --resources dist/electron/win-unpacked/resources
      - run: npm run e2e:native
        env:
          E2E_ARTIFACTS_DIR: outputs/native-${{ runner.os }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-${{ runner.os }}
          retention-days: 7
          path: outputs/native-${{ runner.os }}

  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/nx.mjs build paintwarden
      - run: npm run e2e:browser
        env:
          E2E_ARTIFACTS_DIR: outputs/browser-smoke
      - name: Granular shell, content, CLS and width regression
        run: |
          node scripts/audit-granular-loading.mjs outputs/granular-loading --assert
          node scripts/audit-granular-loading.mjs outputs/granular-loading/matrix --matrix --assert
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: granular-loading
          retention-days: 7
          path: outputs/granular-loading
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-smoke
          retention-days: 7
          path: outputs/browser-smoke

  loading-overlays:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        locales:
          - en,de,es,fr,it,ja,ko
          - nl,pl,pt-BR,ru,zh-Hans,zh-Hant,en-XA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Loading overlay geometry in every width and locale
        run: node scripts/audit-granular-overlays.mjs outputs/loading-overlays
        env:
          AUDIT_LANGUAGES: ${{ matrix.locales }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loading-overlays-${{ strategy.job-index }}
          retention-days: 7
          path: outputs/loading-overlays
