name: Quality

on:
  push:
  pull_request:
  # The Release workflow runs these checks before it builds and uploads a release.
  workflow_call:

jobs:
  shared:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run i18n:check
      - run: npm run codegen:check
      - run: npm run format:check
      - run: npm run lint:eslint
      - run: npm run typecheck:shared
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run storybook:test
      - run: npm run build

  macos:
    timeout-minutes: 25
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/package-desktop-server.mjs electron
      - run: npm run dist --workspace paintwarden-electron -- --dir --publish never
      - run: npm run e2e:native
        env:
          E2E_ARTIFACTS_DIR: outputs/native-${{ runner.os }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-${{ runner.os }}
          retention-days: 7
          path: outputs/native-${{ runner.os }}

  windows:
    timeout-minutes: 25
    # npm's bundled node-gyp supports VS 2022, not the VS 2026 image behind windows-latest.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/package-desktop-server.mjs electron
      - run: npm run dist --workspace paintwarden-electron -- --dir --publish never
      - run: npm run e2e:native
        env:
          E2E_ARTIFACTS_DIR: outputs/native-${{ runner.os }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-${{ runner.os }}
          retention-days: 7
          path: outputs/native-${{ runner.os }}

  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/nx.mjs build paintwarden
      - run: npm run e2e:browser
        env:
          E2E_ARTIFACTS_DIR: outputs/browser-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-smoke
          retention-days: 7
          path: outputs/browser-smoke
